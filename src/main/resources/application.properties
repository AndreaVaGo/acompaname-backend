spring.application.name=acompaname-backend

# Conexión a la base de datos MySQL (Docker)
# Los valores salen de variables de entorno; si no existen, se usan los de desarrollo local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acompaname_db}
spring.datasource.username=${DB_USER:acompaname_user}
spring.datasource.password=${DB_PASSWORD:acompaname_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API
api-endpoint=api/v1