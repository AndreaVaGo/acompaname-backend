spring.application.name=acompaname-backend

# Conexión a la base de datos MySQL (Docker)
# Los valores salen de variables de entorno; si no existen, se usan los de desarrollo local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acompaname_db}
spring.datasource.username=${DB_USER:acompaname_user}
spring.datasource.password=${DB_PASSWORD:acompaname_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# En desarrollo se usa "update" para no perder datos entre reinicios.
# En producción se pondría JPA_DDL_AUTO=validate (o migraciones) y SHOW_SQL=false.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# API
api-endpoint=api/v1


# CORS: orígenes del frontend que pueden llamar a la API (separados por comas)
# Si no existe la variable CORS_ORIGINS, se usa el servidor de desarrollo de Vite
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}