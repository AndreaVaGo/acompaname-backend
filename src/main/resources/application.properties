spring.application.name=acompaname-backend

# Conexión a la base de datos MySQL (Docker)
# Los valores salen de variables de entorno; si no existen, se usan los de desarrollo local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acompaname_db}
spring.datasource.username=${DB_USER:acompaname_user}
spring.datasource.password=${DB_PASSWORD:acompaname_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# En desarrollo se usa "update" para no perder datos entre reinicios.
# En producción se pondría JPA_DDL_AUTO=validate (o migraciones) y SHOW_SQL=false.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# La conexión a la base de datos se libera al terminar el servicio, no al terminar la petición.
# (Por defecto Spring la mantiene abierta toda la petición y avisa en el log)
spring.jpa.open-in-view=false

# API
api-endpoint=api/v1


# CORS: orígenes del frontend que pueden llamar a la API (separados por comas)
# Si no existe la variable CORS_ORIGINS, se usa el servidor de desarrollo de Vite
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Usuario administrador que se crea al arrancar la aplicación
# Si no se definen las variables ADMIN_EMAIL y ADMIN_PASSWORD, no se crea ningún administrador
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Tokens JWT del login
# jwt.secret es la clave con la que se firman los tokens (mínimo 32 caracteres).
# La de abajo es SOLO para desarrollo: en producción hay que definir la variable JWT_SECRET con una larga y secreta.
# jwt.expiration-minutes es lo que dura cada token (por defecto 2 horas).
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiala-en-produccion}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Límite de peticiones en el login y en el registro, por dirección IP
# rate-limit.max-requests es cuántas peticiones se permiten en rate-limit.window-seconds segundos (por defecto 5 por minuto).
# Para los tests e2e en local se puede subir con la variable RATE_LIMIT_MAX_REQUESTS.
rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
# rate-limit.cerca-max-requests: máximo de búsquedas por cercanía (/cuidadores/cerca) por IP en esa misma ventana
# (por defecto 20 por minuto). Es más alto que el del login porque es una búsqueda normal, pero cada lugar nuevo
# se consulta a OpenStreetMap, que tiene límites de uso.
rate-limit.cerca-max-requests=${RATE_LIMIT_CERCA_MAX_REQUESTS:20}

# CAPTCHA (Cloudflare Turnstile) en el registro y en el login
# captcha.enabled=false (por defecto): no se pide CAPTCHA. Es lo que se usa en desarrollo, tests y pruebas de carga.
# captcha.enabled=true: el back rechaza (400) el registro y el login sin un token válido.
# En ese caso hace falta CAPTCHA_SECRET (la clave secreta de Turnstile); sin ella la aplicación no arranca.
# La clave secreta NUNCA va en el código. Para probar sin cuenta, Cloudflare da claves de prueba:
#   secreta que siempre pasa: 1x0000000000000000000000000000000AA
#   secreta que siempre falla: 2x0000000000000000000000000000000AA
captcha.enabled=${CAPTCHA_ENABLED:false}
captcha.secret=${CAPTCHA_SECRET:}
captcha.url=${CAPTCHA_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

# Foto de perfil: tamaño máximo de la imagen (ya decodificada), en bytes. Por defecto 300000 (unos 300 KB).
# Solo se aceptan JPG, PNG y WebP.
foto.max-bytes=${FOTO_MAX_BYTES:300000}

# Correo (recuperar contraseña y avisos)
# mail.enabled=false (por defecto): no se envía nada, el correo se escribe en el log. Es lo que se usa en desarrollo.
# mail.enabled=true: se envía de verdad por SMTP con los datos de spring.mail.* (variables MAIL_HOST, MAIL_USER...)
# En local se puede probar con un servidor de correo falso, como Mailpit (host localhost, puerto 1025).
mail.enabled=${MAIL_ENABLED:false}
mail.from=${MAIL_FROM:no-reply@acompaname.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Recuperar la contraseña
# password-reset.minutes: cuánto tiempo vale el enlace que se manda por correo (por defecto 60 minutos).
# app.frontend-url: dirección del front, para construir el enlace del correo (en producción hay que definir FRONTEND_URL).
password-reset.minutes=${PASSWORD_RESET_MINUTES:60}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Inicio de sesión en dos pasos (código de 6 cifras por correo, opcional para cada persona)
# dos-pasos.minutes: cuánto tiempo vale el código (por defecto 10 minutos).
# dos-pasos.max-attempts: cuántas veces se puede fallar con un mismo código antes de que se anule (por defecto 5).
dos-pasos.minutes=${DOS_PASOS_MINUTES:10}
dos-pasos.max-attempts=${DOS_PASOS_MAX_INTENTOS:5}

# Pagos
# pagos.recargo-persona-extra: recargo por cada persona de más en una solicitud (0.25 = 25 % de la tarifa).
# La primera persona se cobra a tarifa completa.
pagos.recargo-persona-extra=${PAGOS_RECARGO_PERSONA_EXTRA:0.25}

# Geolocalización (buscar cuidadores cerca): convierte ciudades en coordenadas con OpenStreetMap, sin clave de API.
# Con GEOCODING_ENABLED=false no se sale a internet y la búsqueda por cercanía no encuentra ningún lugar
geocoding.enabled=${GEOCODING_ENABLED:true}
geocoding.url=${GEOCODING_URL:https://nominatim.openstreetmap.org}
geocoding.user-agent=${GEOCODING_USER_AGENT:Acompaname-Bootcamp/1.0 (proyecto educativo)}

# IP real del cliente detrás de un proxy inverso (Nginx, Caddy, el proxy del hosting...)
# El límite de intentos (rate-limit.*) cuenta por IP. Detrás de un proxy, la IP que ve la aplicación
# es la del proxy, así que todas las personas compartirían contador y se bloquearían entre sí.
# FORWARD_HEADERS_STRATEGY=native: Tomcat lee la IP real de la cabecera X-Forwarded-For.
# Por defecto (none) la cabecera se ignora: es lo correcto en local, sin proxy, y así nadie puede falsearla.
# Solo se hace caso a la cabecera si la petición llega desde un proxy de confianza. Por defecto Tomcat
# confía en direcciones privadas y locales (10.x, 192.168.x, 172.16-31.x, 127.x). Si el proxy del
# hosting tiene otra dirección, se define SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES con su expresión regular.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Fichaje de inicio y fin del servicio (ACOM-241): a cuántos metros de la dirección del servicio
# se considera que la persona cuidadora está "en el lugar"
fichaje.radio-metros=${FICHAJE_RADIO_METROS:300}
# Comprobar con la ubicación si la persona cuidadora está en el lugar (ACOM-241). APAGADO por defecto:
# activarlo manda la dirección del servicio (que puede ser un domicilio) a Nominatim, un servicio de
# terceros. Solo se activa cuando la política de privacidad lo explica. Apagado, el fichaje guarda solo la hora
fichaje.verificar-lugar=${FICHAJE_VERIFICAR_LUGAR:false}

# Limpieza de lo caducado (enlaces de recuperar contraseña y códigos de dos pasos)
# limpieza.cron: cuándo se ejecuta (segundo minuto hora día mes día-de-la-semana). Por defecto, cada noche a las 03:30.
limpieza.cron=${LIMPIEZA_CRON:0 30 3 * * *}

# Comprobación de salud (actuator) para que el hosting o Docker sepan si la aplicación está viva
# Solo se expone "health" y sin detalles: nunca enseña qué base de datos ni qué versiones hay detrás.
# /actuator/health           estado general (incluye la base de datos): UP o DOWN
# /actuator/health/liveness  la aplicación está viva (no mira la base de datos): para decidir si reiniciarla
# /actuator/health/readiness la aplicación puede atender peticiones
# No se debe publicar hacia fuera en el proxy (Caddy solo reenvía /api).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Que el correo no esté disponible no es motivo para dar la aplicación por caída (en local ni hay servidor de correo)
management.health.mail.enabled=false

# Calendario sincronizado (ACOM-236): la persona cuidadora vincula un calendario externo y se lee solo cada hora.
# calendario.hosts-permitidos: servidores desde los que se acepta leer un calendario (y sus subdominios), separados
# por comas. Es una protección: el servidor no debe descargar direcciones de cualquier sitio.
# calendario.sincronizacion-cron: cuándo se vuelven a leer (por defecto, al minuto 10 de cada hora).
calendario.hosts-permitidos=${CALENDARIO_HOSTS_PERMITIDOS:calendar.google.com,outlook.office365.com,outlook.live.com,icloud.com}
calendario.sincronizacion-cron=${CALENDARIO_SINCRONIZACION_CRON:0 10 * * * *}
