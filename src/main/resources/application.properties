spring.application.name=acompaname-backend

# Conexión a la base de datos MySQL (Docker)
# Los valores salen de variables de entorno; si no existen, se usan los de desarrollo local
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acompaname_db}
spring.datasource.username=${DB_USER:acompaname_user}
spring.datasource.password=${DB_PASSWORD:acompaname_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# En desarrollo se usa "update" para no perder datos entre reinicios.
# En producción se pondría JPA_DDL_AUTO=validate (o migraciones) y SHOW_SQL=false.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# API
api-endpoint=api/v1


# CORS: orígenes del frontend que pueden llamar a la API (separados por comas)
# Si no existe la variable CORS_ORIGINS, se usa el servidor de desarrollo de Vite
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Usuario administrador que se crea al arrancar la aplicación
# Si no se definen las variables ADMIN_EMAIL y ADMIN_PASSWORD, no se crea ningún administrador
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Tokens JWT del login
# jwt.secret es la clave con la que se firman los tokens (mínimo 32 caracteres).
# La de abajo es SOLO para desarrollo: en producción hay que definir la variable JWT_SECRET con una larga y secreta.
# jwt.expiration-minutes es lo que dura cada token (por defecto 2 horas).
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiala-en-produccion}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Límite de peticiones en el login y en el registro, por dirección IP
# rate-limit.max-requests es cuántas peticiones se permiten en rate-limit.window-seconds segundos (por defecto 5 por minuto).
# Para los tests e2e en local se puede subir con la variable RATE_LIMIT_MAX_REQUESTS.
rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}