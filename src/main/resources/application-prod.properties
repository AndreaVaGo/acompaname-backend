# Configuración para PRODUCCIÓN (se activa con la variable SPRING_PROFILES_ACTIVE=prod)
# Aquí no hay valores por defecto: si falta alguna de estas variables de entorno,
# la aplicación NO arranca. Así nunca se usan por error las claves de desarrollo.
# Las contraseñas de producción tienen que ser nuevas y distintas a las de desarrollo.
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

# Correo en producción: se envía de verdad por SMTP y no hay valores por defecto
mail.enabled=true
mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Dirección del front para el enlace del correo de recuperar contraseña (sin valor por defecto)
app.frontend-url=${FRONTEND_URL}

# IP real de cada persona detrás del proxy inverso de la plataforma (para la limitación de intentos).
# Con "native", Tomcat lee la cabecera X-Forwarded-For SOLO si la envía un proxy de confianza
# (por defecto, direcciones internas: 10.x, 172.16-31.x, 192.168.x y localhost). Si alguien la
# falsea desde fuera, se ignora. No se cambia la lista de proxies de confianza a propósito.
server.forward-headers-strategy=native

# ---- Endurecimiento de producción (ACOM-211) ----

# La base de datos NO se modifica sola: Hibernate solo comprueba al arrancar que las tablas coinciden con
# el código (validate). Si no coinciden, la aplicación no arranca, en vez de tocar datos reales.
# Solo la PRIMERA vez, con la base de datos vacía, hay que arrancar con JPA_DDL_AUTO=update para crear
# las tablas, y quitar la variable después.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# No se escriben las consultas SQL en el log (pueden llevar datos de las personas)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Los errores nunca enseñan mensajes internos, trazas ni la clase de la excepción
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Nivel de log normal: sin el detalle de depuración
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# En el servidor no hay docker compose: la aplicación no debe intentar arrancarlo
spring.docker.compose.enabled=false
