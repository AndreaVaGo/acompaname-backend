# Pasa todos los tests del back en cada push a dev o main y en cada pull request.
# Los tests de integración usan Testcontainers (MySQL en Docker): los servidores de GitHub ya traen Docker.
name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:

# Solo lectura del código: este flujo no necesita más permisos
permissions:
  contents: read

# Si llega otro push a la misma rama, se cancela la ejecución anterior
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Siete clases de tests (Security...Test y AcompanameBackendApplicationTests) arrancan la aplicación con
    # @SpringBootTest y se conectan a la base de datos de application.properties (localhost:3306).
    # En local es tu MySQL; aquí se levanta uno con los mismos datos que usa por defecto la aplicación
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: acompaname_db
          MYSQL_USER: acompaname_user
          MYSQL_PASSWORD: acompaname_pass
        ports:
          - 3306:3306
        # No se empieza hasta que MySQL responde
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      # Java 21, el mismo que usa el pom.xml y el Dockerfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # En Windows el archivo mvnw puede no tener permiso de ejecución
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x mvnw

      - name: Pasar los tests
        run: ./mvnw -B test
