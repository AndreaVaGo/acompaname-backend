services:
  mysql:
    image: mysql:8.0
    container_name: acompaname-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-acompaname_db}
      MYSQL_USER: ${DB_USER:-acompaname_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-acompaname_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - acompaname_data:/var/lib/mysql

volumes:
  acompaname_data: